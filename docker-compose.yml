services:
  tabelog-map:
    build: .
    container_name: tabelog-map
    ports:
      - "8501:8501"
    volumes:
      - ./tabelog_cache.json:/app/tabelog_cache.json
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  default:
    name: media_server
    external: true

